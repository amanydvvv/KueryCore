services:
  - type: web
    name: kuerycore-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GENERATIVE_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "http://localhost:3000", "https://docu-mind-ai-iota.vercel.app"]'
