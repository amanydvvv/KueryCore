name: Migration Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure no alembic migration files are untracked
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard backend/alembic/versions/)
          if [ -n "$UNTRACKED" ]; then
            echo "[ERROR] Untracked migration file(s) detected:"
            echo "$UNTRACKED"
            echo ""
            echo "You must commit migration files BEFORE applying them to production."
            echo "Run: git add $UNTRACKED && git commit"
            exit 1
          fi
          echo "[OK] All migration files are tracked."

      - name: Check for a single alembic head (no branch forks)
        run: |
          python -m pip install --upgrade pip
          python -m pip install alembic sqlalchemy pgvector
          cd backend
          HEADS_OUTPUT=$(python -m alembic heads)
          echo "$HEADS_OUTPUT"
          HEADS=$(echo "$HEADS_OUTPUT" | grep -c "(head)" || true)
          if [ "$HEADS" -ne 1 ]; then
            echo "[ERROR] Expected exactly 1 alembic head, found $HEADS."
            exit 1
          fi
          echo "[OK] Single alembic head confirmed."
